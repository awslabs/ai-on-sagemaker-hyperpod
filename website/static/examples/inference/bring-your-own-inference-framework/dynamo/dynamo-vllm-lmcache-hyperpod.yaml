apiVersion: v1
kind: Namespace
metadata:
  name: dynamo-hp-lmcache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-hyperpod-config
  namespace: dynamo-hp-lmcache
data:
  config.yaml: |
    chunk_size: 256
    local_cpu: true
    max_local_cpu_size: 4
    save_unfull_chunk: true
    extra_config:
      sagemaker_hyperpod_shared_memory_name: ai_toolkit_cache
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-lmcache-frontend
  namespace: dynamo-hp-lmcache
spec:
  type: ClusterIP
  selector:
    app: dynamo-lmcache-frontend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-lmcache-worker-metrics
  namespace: dynamo-hp-lmcache
spec:
  type: ClusterIP
  selector:
    app: dynamo-lmcache-worker
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-lmcache-frontend
  namespace: dynamo-hp-lmcache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dynamo-lmcache-frontend
  template:
    metadata:
      labels:
        app: dynamo-lmcache-frontend
    spec:
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6-workers
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: dynamo-lmcache-worker
              topologyKey: kubernetes.io/hostname
      containers:
        - name: dynamo-frontend
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /dynamo-store
              export DYN_FILE_KV=/dynamo-store

              exec python3 -m dynamo.frontend \
                --namespace dynamo-hp-lmcache \
                --http-port 8000 \
                --discovery-backend file \
                --request-plane tcp \
                --event-plane zmq \
                --router-mode round-robin \
                --model-name Qwen/Qwen3-0.6B
          env:
            - name: DYN_SYSTEM_PORT
              value: "8081"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8081
              name: metrics
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: dynamo-discovery
              mountPath: /dynamo-store
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: dynamo-discovery
          hostPath:
            # Node-local file discovery keeps the G6 example simple. Use etcd
            # or DNS discovery for production multi-node Dynamo deployments.
            path: /tmp/dynamo-file-discovery/dynamo-hp-lmcache
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-lmcache-worker
  namespace: dynamo-hp-lmcache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dynamo-lmcache-worker
  template:
    metadata:
      labels:
        app: dynamo-lmcache-worker
    spec:
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dynamo-vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /dynamo-store
              export DYN_FILE_KV=/dynamo-store

              exec python3 -m dynamo.vllm \
                --namespace dynamo-hp-lmcache \
                --discovery-backend file \
                --request-plane tcp \
                --event-plane zmq \
                --model Qwen/Qwen3-0.6B \
                --enable-prefix-caching \
                --max-model-len 8192 \
                --gpu-memory-utilization 0.70 \
                --kv-transfer-config '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both","kv_connector_extra_config":{"sagemaker_hyperpod_shared_memory_name":"ai_toolkit_cache"}}'
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LMCACHE_CONFIG_FILE
              value: /etc/lmcache/config.yaml
            - name: LMCACHE_USE_EXPERIMENTAL
              value: "True"
            - name: LMCACHE_LOCAL_CPU
              value: "True"
            - name: LMCACHE_MAX_LOCAL_CPU_SIZE
              value: "4"
            - name: LMCACHE_CHUNK_SIZE
              value: "256"
            - name: LMCACHE_REMOTE_URL
              value: sagemaker-hyperpod://$(NODE_IP):9200
            - name: DYN_SYSTEM_PORT
              value: "8081"
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 8081
              name: metrics
          resources:
            requests:
              cpu: 500m
              memory: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hp-tiered-cache
              mountPath: /dev/shm/ai_toolkit_cache
            - name: dynamo-discovery
              mountPath: /dynamo-store
            - name: lmcache-config
              mountPath: /etc/lmcache
              readOnly: true
          startupProbe:
            exec:
              command: ["pgrep", "-f", "dynamo.vllm"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "dynamo.vllm"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "dynamo.vllm"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: hp-tiered-cache
          hostPath:
            path: /dev/shm/ai_toolkit_cache
            type: File
        - name: dynamo-discovery
          hostPath:
            # Node-local file discovery keeps the G6 example simple. Use etcd
            # or DNS discovery for production multi-node Dynamo deployments.
            path: /tmp/dynamo-file-discovery/dynamo-hp-lmcache
            type: DirectoryOrCreate
        - name: lmcache-config
          configMap:
            name: lmcache-hyperpod-config
