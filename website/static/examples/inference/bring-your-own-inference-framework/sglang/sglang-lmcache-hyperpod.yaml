apiVersion: v1
kind: Namespace
metadata:
  name: sglang-hp-lmcache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-hyperpod-config-template
  namespace: sglang-hp-lmcache
data:
  config.yaml: |
    chunk_size: 256
    local_cpu: true
    max_local_cpu_size: 4
    save_unfull_chunk: true
    use_layerwise: true
    remote_url: "sagemaker-hyperpod://NODE_IP_PLACEHOLDER:9200"
    remote_serde: "naive"
    extra_config:
      sagemaker_hyperpod_shared_memory_name: ai_toolkit_cache
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-lmcache
  namespace: sglang-hp-lmcache
spec:
  type: ClusterIP
  selector:
    app: sglang-lmcache
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-lmcache
  namespace: sglang-hp-lmcache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sglang-lmcache
  template:
    metadata:
      labels:
        app: sglang-lmcache
    spec:
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sglang
          image: lmsysorg/sglang:v0.5.15-cu130
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install -q lmcache==0.5.1
              lmcache_file=$(python3 -c 'import sglang.srt.mem_cache.storage.lmcache.lmc_radix_cache as m; print(m.__file__)')
              if ! grep -q 'self._mode = LMCacheMode.MP' "$lmcache_file"; then
                echo "ERROR: SGLang LMCache mode patch target not found; the SGLang API may have changed." >&2
                echo "This example was validated against lmsysorg/sglang:v0.5.15-cu130 with lmcache==0.5.1." >&2
                echo "Check whether SGLang now supports LMCache IP mode through a CLI or config option." >&2
                exit 1
              fi
              sed -i 's/self\._mode = LMCacheMode\.MP/self._mode = LMCacheMode.IP/' "$lmcache_file"
              sed "s/NODE_IP_PLACEHOLDER/${NODE_IP}/" /etc/lmcache-template/config.yaml > /tmp/lmcache.yaml

              exec python3 -m sglang.launch_server \
                --model-path Qwen/Qwen3-0.6B \
                --host 0.0.0.0 \
                --port 8000 \
                --mem-fraction-static 0.70 \
                --context-length 8192 \
                --enable-lmcache \
                --lmcache-config-file /tmp/lmcache.yaml
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 26Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hp-tiered-cache
              mountPath: /dev/shm/ai_toolkit_cache
            - name: lmcache-template
              mountPath: /etc/lmcache-template
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: hp-tiered-cache
          hostPath:
            path: /dev/shm/ai_toolkit_cache
            type: File
        - name: lmcache-template
          configMap:
            name: lmcache-hyperpod-config-template
