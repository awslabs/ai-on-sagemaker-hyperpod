apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-hp-lmcache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-hyperpod-config
  namespace: llm-d-hp-lmcache
data:
  config.yaml: |
    chunk_size: 256
    local_cpu: true
    max_local_cpu_size: 4
    save_unfull_chunk: true
    extra_config:
      sagemaker_hyperpod_shared_memory_name: ai_toolkit_cache
---
apiVersion: v1
kind: Service
metadata:
  name: llmd-lmcache-decode
  namespace: llm-d-hp-lmcache
spec:
  type: ClusterIP
  selector:
    app: llmd-lmcache-decode
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-lmcache-decode
  namespace: llm-d-hp-lmcache
  labels:
    app: llmd-lmcache-decode
    llm-d.ai/role: decode
    llm-d.ai/guide: hyperpod-managed-kv-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llmd-lmcache-decode
  template:
    metadata:
      labels:
        app: llmd-lmcache-decode
        llm-d.ai/role: decode
        llm-d.ai/guide: hyperpod-managed-kv-cache
    spec:
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --enable-prefix-caching
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.70"
            - --kv-transfer-config
            - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both","kv_connector_extra_config":{"sagemaker_hyperpod_shared_memory_name":"ai_toolkit_cache"}}'
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LMCACHE_CONFIG_FILE
              value: /etc/lmcache/config.yaml
            - name: LMCACHE_USE_EXPERIMENTAL
              value: "True"
            - name: LMCACHE_LOCAL_CPU
              value: "True"
            - name: LMCACHE_MAX_LOCAL_CPU_SIZE
              value: "4"
            - name: LMCACHE_CHUNK_SIZE
              value: "256"
            - name: LMCACHE_REMOTE_URL
              value: sagemaker-hyperpod://$(NODE_IP):9200
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hp-tiered-cache
              mountPath: /dev/shm/ai_toolkit_cache
            - name: lmcache-config
              mountPath: /etc/lmcache
              readOnly: true
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: hp-tiered-cache
          hostPath:
            path: /dev/shm/ai_toolkit_cache
            type: File
        - name: lmcache-config
          configMap:
            name: lmcache-hyperpod-config
