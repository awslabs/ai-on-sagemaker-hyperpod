Parameters:
  ResourceNamePrefix:
    Description: Prefix to be used for all resources created by this template.
    Type: String
    Default: sagemaker-hyperpod-eks

  VpcId:
    Description: The ID of the VPC where the FSx for Lustre file system will be created.
    Type: String

  PrivateSubnetId:
    Description: The ID of the private subnet where the FSx for Lustre file system will be created.
    Type: String

  SecurityGroupId:
    Description: The ID of the security group to associate with the FSx for Lustre file system.
    Type: String

  # EKSClusterName:
  #   Description: The name of the EKS cluster.
  #   Type: String
  #   Default: dummy-cluster-name
    
  # ProcessData:
  #   Description: Whether to download and process data into the FSx for Lustre file system.
  #   Type: String
  #   Default: 'true'
  #   AllowedValues:
  #     - 'true'
  #     - 'false'

  DeploymentType:
    Description: The deployment type for the FSx for Lustre file system.
    Type: String
    Default: PERSISTENT_2
    AllowedValues:
      - PERSISTENT_1
      - PERSISTENT_2
      - SCRATCH_1
      - SCRATCH_2

  StorageCapacity:
    Description: The storage capacity of the FSx for Lustre file system in GiB.
    Type: Number
    Default: 1200
    MinValue: 1200
    MaxValue: 100800

  PerUnitStorageThroughput:
    Description: The throughput in MB/s/TiB for the FSx for Lustre file system.
    Type: Number
    Default: 250
    AllowedValues:
      - 125
      - 250
      - 500
      - 1000

  DataCompressionType:
    Description: The data compression type for the FSx for Lustre file system.
    Type: String
    Default: LZ4
    AllowedValues:
      - NONE
      - LZ4

  FileSystemTypeVersion:
    Description: The Lustre version for the FSx for Lustre file system.
    Type: String
    Default: "2.15"

  HelmChartStatus:
    Description: Status of the Helm chart deployment (used for dependency management).
    Type: String
    Default: HelmChartNotRequired
    
# Conditions:
#   ShouldProcessData: !Equals
#     - !Ref ProcessData
#     - 'true'


Resources:
  FSxLustreSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      SourceSecurityGroupId: !Ref SecurityGroupId
      Description: Allow Lustre traffic between nodes

  FSxLustreSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      DestinationSecurityGroupId: !Ref SecurityGroupId
      Description: Allow Lustre traffic between nodes

  FSxLustreFileSystem:
    Type: AWS::FSx::FileSystem
    Properties:
      FileSystemType: LUSTRE
      StorageCapacity: !Ref StorageCapacity
      SubnetIds:
        - !Ref PrivateSubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      LustreConfiguration:
        DeploymentType: !Ref DeploymentType
        PerUnitStorageThroughput: !Ref PerUnitStorageThroughput
        DataCompressionType: !Ref DataCompressionType
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-fsx-lustre"

