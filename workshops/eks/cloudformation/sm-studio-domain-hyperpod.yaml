AWSTemplateFormatVersion: "2010-09-09"
Description: AWS CloudFormation Template for SageMaker Studio Domain

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks 
    Description: Prefix for resources. 
  EKSClusterName:
    Type: String
    Description: Name of the Amazon EKS cluster to associate with the SageMaker domain.
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from the HyperPod cluster stack
  ExistingSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs from the HyperPod cluster stack
  ExistingFSxLustreId:
    Type: String
    Description: ID of the existing FSx Lustre file system
    AllowedPattern: ^(fs-[0-9a-f]{8,})$
  FSxClaimName:
    Type: String
    Default: "fsx-claim"
    Description: Name of the FSx claim to associate with the FSx for Lustre volume
  KubernetesNamespace:
    Type: String
    Default: "default"
    Description: Namespace where temporary pods will be created to set partition permissions in the FSx volume. The FSx for lustre setup MUST have been done in this namespace.
  SharedFSx:
    Type: String
    Description: Whether to use the FSx for Lustre volume shared across all the Studio user profiles or create a private partitions for them
    AllowedValues:
      - "True"
      - "False"
    Default: "True"
  AutoStopIdleTimeInMinutes:
    Description: Idle time (in minutes) before auto-stop of Code Editor, disabled if 0 (Must be 60 or greater, or 0.)
    Type: Number
    Default: 4320
    MinValue: 0
  EbsSizeInGb:
    Description: EBS volume size of Code Editor (This parameter cannot be decreased after creation.)
    Type: Number
    Default: 20
    MinValue: 5
  
  InstanceType:
    Description: Instance type of Code Editor
    Type: String
    Default: ml.t3.medium
    AllowedValues:
    - ml.t3.medium
    - ml.t3.large
    - ml.m5.large
    - ml.m5.2xlarge
    - ml.c5.large

Conditions:
  CreatePrivatePartitions: !Equals [!Ref SharedFSx, "False"]
  EnableAutoStop: !Not [!Equals [!Ref AutoStopIdleTimeInMinutes, 0]]

