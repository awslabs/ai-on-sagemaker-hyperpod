  SageMakerStudioKubernetesCELifecycleConfig:
    Type: AWS::SageMaker::StudioLifecycleConfig
    Properties:
      StudioLifecycleConfigAppType: CodeEditor
      StudioLifecycleConfigContent:
        Fn::Base64: |
          #!/bin/bash

          # Exit on error
          set -e

          # Setup logging
          LOG_FILE="/home/sagemaker-user/studio-lifecycle-config.log"
          exec > >(tee $LOG_FILE) 2>&1

          # install tools
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt update -qq
          sudo apt install -y -qq vim git jq curl

          # Create user bin directory
          USER_BIN="/home/sagemaker-user/.local/bin"
          mkdir -p $USER_BIN

          # Add to PATH in both .bashrc and .bash_profile
          touch /home/sagemaker-user/.bash_profile
          grep -q "export PATH=$USER_BIN:\$PATH" /home/sagemaker-user/.bashrc || echo "export PATH=$USER_BIN:$PATH" >> /home/sagemaker-user/.bashrc
          grep -q "export PATH=$USER_BIN:\$PATH" /home/sagemaker-user/.bash_profile || echo "export PATH=$USER_BIN:$PATH" >> /home/sagemaker-user/.bash_profile

          # Set PATH for current session
          export PATH=$USER_BIN:$PATH

          # install kubectl if not present
          if [ ! -f $USER_BIN/kubectl ]; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl $USER_BIN/
          fi

          # install eksctl if not present
          if [ ! -f $USER_BIN/eksctl ]; then
            curl -sLO "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
            tar -xzf eksctl_Linux_amd64.tar.gz
            chmod +x eksctl
            mv eksctl $USER_BIN/
            rm eksctl_Linux_amd64.tar.gz
          fi 

          # install helm if not present
          if ! command -v helm &> /dev/null; then
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
            chmod 700 get_helm.sh
            ./get_helm.sh
            rm get_helm.sh
          fi

          # Function to compare versions
          version_compare() {
            if [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; then
              return 0
            else
              return 1
            fi
          }

          check_aws_cli_version() {
            if [ -f ~/.local/bin/aws ]; then
              current_version=$(~/.local/bin/aws --version 2>&1 | cut -d/ -f2 | cut -d' ' -f1)
              required_version="2.17.47"
              if version_compare "$current_version" "$required_version"; then
                return 0  # Current version is >= required version
              fi
            fi
            return 1  # AWS CLI needs to be installed or updated
          }

          # Update AWS CLI if needed
          if ! check_aws_cli_version; then
            echo "Installing/Updating AWS CLI to version >= 2.17.47"
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -o awscliv2.zip
            ./aws/install -i ~/.local/aws-cli -b ~/.local/bin --update
            rm -rf aws awscliv2.zip
          fi

          # install docker if not present
          if ! command -v docker &> /dev/null; then
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt update -qq
            sudo apt install -y -qq docker-ce=5:20.10.24~3-0~ubuntu-jammy docker-ce-cli=5:20.10.24~3-0~ubuntu-jammy docker-buildx-plugin=0.17.1-1~ubuntu.22.04~jammy docker-compose-plugin=2.29.7-1~ubuntu.22.04~jammy
          fi

          # Install kubetail
          if [ ! -f $USER_BIN/kubetail ]; then
            curl -sLO "https://raw.githubusercontent.com/johanhaleby/kubetail/master/kubetail"
            chmod +x kubetail
            mv kubetail $USER_BIN/
          fi

          # Studio mounts the entire FSx root (Spaces don't support FileSystemPath)
          echo "Waiting for FSx filesystem to be mounted..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          FSX_MOUNT=""

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            FSX_MOUNT=$(find /home/sagemaker-user/custom-file-systems/fsx_lustre -maxdepth 1 -name 'fs-*' 2>/dev/null | head -n1)
            if [ -n "$FSX_MOUNT" ]; then
              echo "✓ FSx filesystem found at: $FSX_MOUNT"
              ln -sf ${FSX_MOUNT} /home/sagemaker-user/fsx-shared
              break
            fi
            echo "Waiting for FSx mount... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
            sleep 2
            RETRY_COUNT=$((RETRY_COUNT+1))
          done

          if [ -z "$FSX_MOUNT" ]; then
            echo "✗ ERROR: FSx filesystem not found after $MAX_RETRIES attempts"
            echo "✗ This may indicate that the FSx filesystem was not attached to the space"
            exit 1
          fi

          # Auto-source workshop environment variables
          echo "Checking for env_vars file..."
          if [ -f ~/fsx-shared/env_vars ]; then
            echo "✓ File exists, proceeding with bashrc update"
            echo "✓ Contents of env_vars file:"
            cat ~/fsx-shared/env_vars
            
            grep -q "source ~/fsx-shared/env_vars" /home/sagemaker-user/.bashrc || \
            echo "source ~/fsx-shared/env_vars" >> /home/sagemaker-user/.bashrc
            
            # Source for local access (script) too 
            source ~/fsx-shared/env_vars
            
            echo "✓ After sourcing, EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME"
            echo "✓ After sourcing, AWS_REGION=$AWS_REGION"

            # Update kubeconfig for the EKS cluster
            if [ -n "$EKS_CLUSTER_NAME" ] && [ -n "$AWS_REGION" ]; then
              echo "Configuring kubectl access to EKS cluster: $EKS_CLUSTER_NAME"
              mkdir -p /home/sagemaker-user/.kube
              aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION --kubeconfig /home/sagemaker-user/.kube/config
              chmod 600 /home/sagemaker-user/.kube/config

              # Set KUBECONFIG in bashrc 
              grep -q "export KUBECONFIG=" /home/sagemaker-user/.bashrc || \
                echo "export KUBECONFIG=/home/sagemaker-user/.kube/config" >> /home/sagemaker-user/.bashrc

              # Verify kubectl access
              if kubectl get nodes &>/dev/null; then
                echo "✓ kubectl configured successfully - cluster accessible"
                kubectl get nodes
              else
                echo "⚠ kubectl configured but cluster not accessible yet (may need IAM permissions)"
              fi
            else
              echo "✗ ERROR: EKS cluster name or region not found in env_vars"
              exit 1
            fi
          else
            echo "✗ ERROR: env_vars file not found at ~/fsx-shared/env_vars"
            echo "✗ This may indicate that the management instance setup has not completed"
            echo "✗ Debugging information:"
            echo "✗ Listing FSx mount root:"
            ls -la ~/fsx-shared/ || echo "Cannot list fsx-shared directory"
            exit 1
          fi
        
          # add completion if not present
          LINE="complete -C '/usr/local/bin/aws_completer' aws"
          grep -qxF "$LINE" /home/sagemaker-user/.bashrc || echo "$LINE" >> /home/sagemaker-user/.bashrc

          # remove metadata file
          METADATA_FILE="/home/sagemaker-user/.sagemaker-last-active-timestamp"
          if [ -f $METADATA_FILE ]; then
              rm $METADATA_FILE
          fi
      StudioLifecycleConfigName: !Sub ${AWS::StackName}-ce

